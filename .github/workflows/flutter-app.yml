# Builds the Flutter version of "מחשבון שכר" (flutter_app/) for Windows and Android. The results are on the
# run's page under "Artifacts". Releases (and the update manifest the apps read) are published to the public
# repo shlomoappdev-netizen/maskoret-releases, together with the Mac build.
#
# The version and build number come from version.json — one counter for all the apps.
# Optional secrets, so the APK is signed with the permanent key (otherwise it can't update an installed app):
#   ANDROID_KEYSTORE_BASE64    — base64 of flutter_app/android/maskoret-release.jks
#   ANDROID_KEYSTORE_PASSWORD  — its password
name: Flutter app (Windows + Android)

on:
  push:
    branches: [main]
    paths:
      - 'flutter_app/**'
      - 'rates/**'
      - 'version.json'
      - '.github/workflows/flutter-app.yml'
  workflow_dispatch:
  # release.yml calls it for a release; the files stay in that run.
  workflow_call:
    inputs:
      # The APK was built on the Mac (tools/upload_android_build.sh): release.yml takes it from there.
      skip_android:
        type: boolean
        default: false

env:
  FLUTTER_VERSION: '3.44.4'

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # pdfium_dart downloads PDFium from a GitHub release link while building; when those links answer 504
      # (as on 08.11.2026) the build fails. Put it where the package looks first, trying the link and then the API.
      - name: PDFium
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rel=chromium%2F7811
          dir=".dart_tool/hooks_runner/shared/pdfium_dart/build/${rel/\%2F/_}/win-x64"
          [ -f "$dir/pdfium.dll" ] && exit 0
          mkdir -p "$dir"
          for i in 1 2 3 4 5; do
            curl -fsSL --retry 2 "https://github.com/bblanchon/pdfium-binaries/releases/download/$rel/pdfium-win-x64.tgz" -o pdfium.tgz && break
            url=$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" "https://api.github.com/repos/bblanchon/pdfium-binaries/releases/tags/$rel" \
                  | jq -r '.assets[] | select(.name == "pdfium-win-x64.tgz") | .url') \
              && curl -fsSL -H "Accept: application/octet-stream" -H "Authorization: Bearer $GH_TOKEN" "$url" -o pdfium.tgz && break
            echo "PDFium download failed (try $i)"; sleep 20
          done
          tar -xzf pdfium.tgz bin/pdfium.dll
          mv bin/pdfium.dll "$dir/pdfium.dll"
          rm -rf bin pdfium.tgz
          ls -la "$dir"
      # The Swift cross-check needs a Mac; every other test runs here.
      - run: flutter test --exclude-tags swift
      - name: Build
        shell: pwsh
        run: |
          $v = Get-Content ../version.json -Raw | ConvertFrom-Json
          flutter build windows --release --build-name $v.version --build-number $v.build
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath build/maskoret-windows.zip -Force
      - name: Installer
        shell: pwsh
        run: |
          $v = Get-Content ../version.json -Raw | ConvertFrom-Json
          if (-not (Test-Path "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe")) { choco install innosetup -y --no-progress }
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$($v.version)" "/DAppBuild=$($v.build)" windows\installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # The ZIP stays for copies of 4.1.x, which update by unpacking it; new copies install with the setup.
      - uses: actions/upload-artifact@v4
        with:
          name: maskoret-windows
          path: |
            flutter_app/build/maskoret-windows.zip
            flutter_app/build/maskoret-windows-setup.exe
          retention-days: 30

  android:
    if: ${{ !inputs.skip_android }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret — the APK is signed with a temporary key and can't update an installed app."
            # A release must never ship such an APK.
            if [ "${{ github.event_name }}" = "workflow_call" ] || [ "${{ github.workflow }}" = "Release" ]; then exit 1; fi
          fi
      # The NDK download on the runner sometimes arrives broken ("Archive is not a ZIP archive") and fails the build:
      # install it first, and try again with a clean copy if it fails.
      - name: NDK
        run: |
          # The version Flutter's Gradle plugin asks for (flutter.ndkVersion).
          ndk=$(grep -hoE 'val ndkVersion: String = "[0-9.]+"' "$FLUTTER_ROOT/packages/flutter_tools/gradle/src/main/kotlin/FlutterExtension.kt" 2>/dev/null | grep -oE '[0-9]+\.[0-9.]+' || true)
          [ -z "$ndk" ] && { echo "NDK version not found; the build will install it."; exit 0; }
          sdkm="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          for i in 1 2 3; do
            yes | "$sdkm" --install "ndk;$ndk" > /dev/null && [ -f "$ANDROID_HOME/ndk/$ndk/source.properties" ] && { echo "NDK $ndk ready"; exit 0; }
            echo "NDK $ndk install failed (try $i) — cleaning up and trying again"
            rm -rf "$ANDROID_HOME/ndk/$ndk" ~/.android/cache; sleep 10
          done
          exit 1
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          flutter build apk --release --build-name "$(jq -r .version ../version.json)" --build-number "$(jq -r .build ../version.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: maskoret-android
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
