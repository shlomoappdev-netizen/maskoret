# Publishes a new version of מחשבון שכר to everyone, in the cloud:
#   when version.json on main has "ready": true and a build newer than the site's latest.json —
#   builds Windows (flutter-app.yml) and the Mac app (signed with the "Maskoret Signing" certificate) —
#   or, when tools/upload_mac_build.sh already uploaded a DMG built on the Mac (prerelease "mac-build-<build>"),
#   takes that one instead of waiting for a macOS runner. Android is not published here any more: since 4.23.1 it
#   comes only from Google Play (tools/build_play_bundle.sh, uploaded to Play Console by hand); latest.json keeps
#   the last APK's entry, so the APK from the site stays at that version (which asks the user to move to Play) —
#   creates the GitHub release in this repo with the files, and updates latest.json + changelog.json on the
#   download site (shlomoappdev-netizen/maskoret-releases), which every app checks for updates.
#   Each platform goes out as soon as its own build is ready: if one fails, the others are published anyway (the
#   failed one keeps its previous file on the site, an issue is opened, and the scheduled run tries it again).
#
# Secrets (set once with tools/setup_cloud_release.sh):
#   ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD  the permanent Android signing key
#   MAC_CERT_P12, MAC_CERT_PASSWORD                     the "Maskoret Signing" certificate (base64 of a .p12)
#   SITE_DEPLOY_KEY                                     SSH key that may push only to maskoret-releases
#   MANIFEST_SIGNING_KEY                                Ed25519 key (PEM) that signs latest.json (tools/manifest_sig.py)
name: Release

on:
  push:
    branches: [main]
    paths: ['version.json']
  # A safety net: a release that failed (a broken build, a GitHub outage) is tried again every 3 hours until it's out.
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build and sign everything, without publishing'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.v.outputs.go }}
      version: ${{ steps.v.outputs.version }}
      local_mac: ${{ steps.v.outputs.local_mac }}
      need_mac: ${{ steps.v.outputs.need_mac }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version version.json); build=$(jq -r .build version.json); ready=$(jq -r '.ready // false' version.json)
          manifest=$(curl -fsS "https://shlomoappdev-netizen.github.io/maskoret-releases/latest.json?t=$(date +%s)")
          # The oldest platform on the site (each platform carries its own build; older manifests only the top one).
          # Android is not counted: since 4.23.1 (build 77) it comes from Google Play, and its entry stays as it was.
          site=$(echo "$manifest" | jq -r '([(.platforms // {}) | to_entries[] | select(.key != "android") | .value.build // empty] | min) // .build')
          site_mac=$(echo "$manifest" | jq -r '.platforms.mac.build // .build')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # The Mac is built again only if the site doesn't have this build for it yet.
          if [ "$build" -gt "$site_mac" ]; then echo "need_mac=true" >> "$GITHUB_OUTPUT"; else echo "need_mac=false" >> "$GITHUB_OUTPUT"; fi
          # A Mac build uploaded from the Mac (tools/upload_mac_build.sh) for this build number.
          if gh release view "mac-build-$build" --json assets --jq '.assets[].name' 2>/dev/null | grep -qx maskoret-mac.dmg; then
            echo "local_mac=true" >> "$GITHUB_OUTPUT"; echo "Using the Mac build uploaded from the Mac (mac-build-$build)."
          else
            echo "local_mac=false" >> "$GITHUB_OUTPUT"
          fi
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "Dry run: building $version ($build) without publishing."
          elif [ "$ready" = "true" ] && [ "$build" -gt "$site" ]; then
            echo "go=true" >> "$GITHUB_OUTPUT"; echo "Releasing $version ($build); the site has build $site."
          else
            echo "go=false" >> "$GITHUB_OUTPUT"; echo "Nothing to release: $version ($build), ready=$ready, site build $site."
          fi

  apps:
    needs: check
    if: needs.check.outputs.go == 'true'
    uses: ./.github/workflows/flutter-app.yml
    with:
      # Android is published only on Google Play (tools/build_play_bundle.sh, uploaded by hand) — no APK on the site.
      skip_android: true
    secrets: inherit

  # The Mac build uploaded from the Mac: passed on as the same artifact the cloud build makes.
  mac_local:
    needs: check
    if: needs.check.outputs.go == 'true' && needs.check.outputs.need_mac == 'true' && needs.check.outputs.local_mac == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(curl -fsS "https://raw.githubusercontent.com/$GITHUB_REPOSITORY/$GITHUB_SHA/version.json" | jq -r .build)
          mkdir out && gh release download "mac-build-$build" -R "$GITHUB_REPOSITORY" -p maskoret-mac.dmg -D out
      - uses: actions/upload-artifact@v4
        with:
          name: maskoret-mac
          path: out/maskoret-mac.dmg
          retention-days: 30

  mac:
    needs: check
    if: needs.check.outputs.go == 'true' && needs.check.outputs.need_mac == 'true' && needs.check.outputs.local_mac != 'true'
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Signing certificate
        env:
          P12: ${{ secrets.MAC_CERT_P12 }}
          P12_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          if [ -z "$P12" ]; then echo "::error::Missing MAC_CERT_P12 (run tools/setup_cloud_release.sh)"; exit 1; fi
          KC="$RUNNER_TEMP/signing.keychain-db"; KCPW="$(uuidgen)"
          security create-keychain -p "$KCPW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$KCPW" "$KC"
          echo "$P12" | base64 -d > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KCPW" "$KC" >/dev/null
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          # The certificate is self-signed: trust it for signing on this runner.
          security find-certificate -c "Maskoret Signing" -p "$KC" > "$RUNNER_TEMP/cert.pem"
          sudo security add-trusted-cert -d -r trustRoot -p codeSign -k /Library/Keychains/System.keychain "$RUNNER_TEMP/cert.pem"
          rm "$RUNNER_TEMP/cert.p12"
          security find-identity -v -p codesigning "$KC"
      - name: Build
        run: |
          export DEVELOPER_DIR="$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)/Contents/Developer"
          xcodebuild -version
          version=$(jq -r .version version.json); build=$(jq -r .build version.json)
          set -o pipefail
          xcodebuild -project Maskoret.xcodeproj -scheme Maskoret -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build/dd CODE_SIGNING_ALLOWED=NO MARKETING_VERSION="$version" CURRENT_PROJECT_VERSION="$build" \
            -skipMacroValidation -skipPackagePluginValidation build > build.log 2>&1 \
            || { grep -E "error:" build.log | sort -u | head -40; tail -30 build.log; exit 1; }
          tail -2 build.log
      - name: Sign and pack
        run: |
          APP="$(ls -d build/dd/Build/Products/Release/*.app | head -1)"
          codesign --force --deep --sign "Maskoret Signing" "$APP"
          codesign -dvv "$APP" 2>&1 | grep -E "Authority|Identifier"
          mkdir -p stage out
          ditto "$APP" "stage/$(basename "$APP")"
          ln -s /Applications stage/Applications
          hdiutil create -volname "מחשבון שכר $(jq -r .version version.json)" -srcfolder stage -ov -format UDZO out/maskoret-mac.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: maskoret-mac
          path: out/maskoret-mac.dmg
          retention-days: 30

  publish:
    needs: [check, apps, mac, mac_local]
    # Publishes whatever was built, even if another platform failed.
    # (release_manifest.py stops it when no platform built anything new).
    if: "!cancelled() && inputs.dry_run != true && needs.check.outputs.go == 'true'"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dl
      - name: Collect the files
        env:
          # Ed25519 key that signs every new entry of latest.json; the apps refuse an entry without a valid signature.
          MANIFEST_SIGNING_KEY: ${{ secrets.MANIFEST_SIGNING_KEY }}
        run: |
          mkdir out
          # Whichever platforms built; a missing one keeps its previous file on the site.
          [ -f dl/maskoret-android/app-release.apk ] && cp dl/maskoret-android/app-release.apk out/maskoret-android.apk || true
          [ -f dl/maskoret-windows/maskoret-windows-setup.exe ] && cp dl/maskoret-windows/maskoret-windows.zip dl/maskoret-windows/maskoret-windows-setup.exe out/ || true
          [ -f dl/maskoret-mac/maskoret-mac.dmg ] && cp dl/maskoret-mac/maskoret-mac.dmg out/ || true
          curl -fsS "https://shlomoappdev-netizen.github.io/maskoret-releases/latest.json?t=$(date +%s)" -o previous.json || echo '{}' > previous.json
          python3 tools/release_manifest.py out "$GITHUB_REPOSITORY" "v${{ needs.check.outputs.version }}" previous.json
          ls -la out
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${{ needs.check.outputs.version }}"
          files=$(ls out/maskoret-android.apk out/maskoret-windows-setup.exe out/maskoret-windows.zip out/maskoret-mac.dmg 2>/dev/null || true)
          # A retry after a failure further on: the release may already exist — replace its files.
          if gh release view "v$v" >/dev/null 2>&1; then
            gh release upload "v$v" $files --clobber
          else
            gh release create "v$v" $files --title "מחשבון שכר $v" --notes-file out/notes.md --target "$GITHUB_SHA"
          fi
      - name: Update the download site
        env:
          DEPLOY_KEY: ${{ secrets.SITE_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && echo "$DEPLOY_KEY" > ~/.ssh/site && chmod 600 ~/.ssh/site
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/site -o StrictHostKeyChecking=accept-new"
          git clone -q git@github.com:shlomoappdev-netizen/maskoret-releases.git site
          cp out/latest.json out/changelog.json site/
          cd site
          git add latest.json changelog.json
          git -c user.name="maskoret-release" -c user.email="shlomoappdev@gmail.com" commit -q -m "גרסה ${{ needs.check.outputs.version }} ($(cat ../out/built.txt))"
          git push -q
          echo "Published ${{ needs.check.outputs.version }} — the apps offer it on their next check."
      - name: Remove the uploaded Mac build
        if: hashFiles('out/maskoret-mac.dmg') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build=$(jq -r .build version.json)
          gh release delete "mac-build-$build" -R "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true


  # A failed release opens an issue (GitHub notifies the owner); the scheduled run keeps trying meanwhile.
  alert:
    needs: [check, apps, mac, mac_local, publish]
    if: failure() && inputs.dry_run != true
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="הפרסום של גרסה ${{ needs.check.outputs.version }} נכשל"
          url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" -R "$GITHUB_REPOSITORY" --body "נכשל שוב: $url"
          else
            gh issue create -R "$GITHUB_REPOSITORY" --title "$title" \
              --body "הפרסום האוטומטי נכשל: $url — הוא ינסה שוב בעוד עד 3 שעות. אם זה חוזר, צריך לתקן את הבנייה."
          fi

  # A successful release closes the failure issue of that version, if one was opened.
  resolved:
    needs: [check, apps, mac, mac_local, publish]
    if: success() && inputs.dry_run != true && needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="הפרסום של גרסה ${{ needs.check.outputs.version }} נכשל"
          for n in $(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[].number'); do
            gh issue close "$n" -R "$GITHUB_REPOSITORY" --comment "פורסם בהצלחה: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          done
